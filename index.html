<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rynmaru — Sua História Interativa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    min-height: 100vh;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    line-height: 1.6;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.35);
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1 { font-size: 20px; color: #60a5fa; letter-spacing: -0.5px; }
  #story {
    font-size: 17px;
    white-space: pre-wrap;
    min-height: 180px;
    color: #e2e8f0;
    overflow-y: auto;
    padding-right: 4px;
  }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  button {
    background: #3b82f6;
    color: #ffffff;
    border: none;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 17px;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s, transform 0.05s;
  }
  button:hover { background: #2563eb; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #custom { margin-top: 6px; display: flex; gap: 8px; align-items: center; }
  input[type=text] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: none;
    background: #334155;
    color: #ffffff;
    font-size: 16px;
  }
  input[type=text]::placeholder { color: #94a3b8; }

  #status { font-size: 13px; color: #94a3b8; min-height: 18px; }
  #error { font-size: 14px; color: #f87171; min-height: 40px; margin-top: 8px; padding: 10px; background: #7f1d1d; border-radius: 8px; display: none; }

  .restart {
    background: #64748b;
    text-align: center;
    margin-top: 6px;
  }
  .restart:hover { background: #475569; }

  .small-note { font-size: 12px; color: #94a3b8; margin-top: 8px; }
</style>
</head>
<body>
<div class="card">
  <h1>✨ Rynmaru — Sua História</h1>
  <div id="story">Clique em "Começar aventura" para criar sua primeira história.</div>
  <div id="status"></div>
  <div id="error"></div>
  <div class="choices" id="choices"></div>
  <div id="custom">
    <input type="text" id="customInput" placeholder="Ou digite sua própria ação...">
    <button id="customBtn">Fazer</button>
  </div>
  <button class="restart" id="restartBtn" style="display:none">Reiniciar aventura</button>
  <div class="small-note">História gerada por IA. Requer conexão com a internet.</div>
</div>
<script>
const API = '/api/generate';
const storyEl = document.getElementById('story');
const choicesEl = document.getElementById('choices');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const customInput = document.getElementById('customInput');
const customBtn = document.getElementById('customBtn');
const restartBtn = document.getElementById('restartBtn');

let history = [];

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
}

function hideError() {
  errorEl.style.display = 'none';
}

function setLoading(loading) {
  statusEl.textContent = loading ? 'Escrevendo sua história...' : '';
  const disabled = loading;
  customBtn.disabled = disabled;
  customInput.disabled = disabled;
  Array.from(choicesEl.querySelectorAll('button')).forEach(b => (b.disabled = disabled));
}

async function send(message) {
  setLoading(true);
  hideError();
  choicesEl.innerHTML = '';
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, history })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || 'Erro na IA (HTTP ' + res.status + ')');
    }
    const data = await res.json();
    storyEl.textContent = data.text || data.story || 'A história parou por aqui.';
    history = data.history || history;
    renderChoices(data.choices || []);
    restartBtn.style.display = 'inline-block';
  } catch (e) {
    showError('Erro: ' + e.message);
    statusEl.textContent = '';
  } finally {
    setLoading(false);
    customInput.value = '';
  }
}

function renderChoices(choices) {
  choicesEl.innerHTML = '';
  if (!choices || choices.length === 0) {
    const b = document.createElement('button');
    b.textContent = 'Continuar...';
    b.disabled = true;
    choicesEl.appendChild(b);
    return;
  }
  choices.forEach((c) => {
    const b = document.createElement('button');
    b.textContent = c;
    b.onclick = () => send(c);
    choicesEl.appendChild(b);
  });
}

customBtn.onclick = () => {
  const v = customInput.value.trim();
  if (v) send(v);
};
restartBtn.onclick = () => {
  history = [];
  storyEl.textContent = 'Clique em "Começar aventura" para criar sua primeira história.';
  choicesEl.innerHTML = '';
  restartBtn.style.display = 'none';
  statusEl.textContent = '';
  hideError();
};

// Inicia automaticamente
send('Comece uma nova história interativa em português do Brasil. Apresente o cenário inicial do zero e termine com exatamente 3 opções numeradas para o leitor escolher o próximo passo.');
</script>
</body>
</html>
